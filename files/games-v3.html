<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-40deg, #b400ff 0%, #000 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
        }

        .profile-btn {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
            background: #000;
        }

        .profile-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .profile-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: #000;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            position: relative;
            animation: slideUp 0.3s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 2px solid #fff;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #000;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #000;
            transform: rotate(90deg);
        }

        .modal-image {
            width: 150px;
            height: 150px;
            border-radius: 15%;
            object-fit: cover;
            margin: 0 auto 20px;
            display: block;
        }

        .modal-content h2 {
            color: #fff;
            margin-bottom: 10px;
            text-align: center;
        }

        .modal-content .role {
            color: #D6D6D6;
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .modal-content p {
            color: #fff;
            line-height: 1.6;
            text-align: center;
        }

        /* About Us 3D text */

        .text-ab {
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 80px;
            letter-spacing: 0.10em;
            text-align: center;
            padding: 5px;
            background: transparent;
        }

        .depth-right {
            text-shadow:
                1px 1px 0 #ddd, 2px 2px 0 #ccc, 3px 3px 0 #bbb,
                4px 4px 0 #aaa, 5px 5px 0 #999, 6px 6px 0 #888,
                7px 7px 0 #777, 8px 8px 0 #666, 9px 9px 0 #555,
                10px 10px 0 #333,
                0 0 6px #fff, 0 0 14px rgba(255, 255, 255, 0.5), 0 0 28px rgba(255, 255, 255, 0.2);
        }

        .depth-left {
            text-shadow:
                -1px 1px 0 #ddd, -2px 2px 0 #ccc, -3px 3px 0 #bbb,
                -4px 4px 0 #aaa, -5px 5px 0 #999, -6px 6px 0 #888,
                -7px 7px 0 #777, -8px 8px 0 #666, -9px 9px 0 #555,
                -10px 10px 0 #333,
                0 0 6px #fff, 0 0 14px rgba(255, 255, 255, 0.5), 0 0 28px rgba(255, 255, 255, 0.2);
        }

        .text-p {
            color: #fff;
            font-size: 20px;
            font-family: mono;
            text-align: center;
            border: 2px solid black;
            border-color: #000;

        }

        .text-container {
            overflow: visible;
        }

        .animation {
            display: block;
            transform: translateY(-100%);
            opacity: 0;
        }

        .animation.reveal {
            animation: revealFromTop 1s ease-out forwards;
        }

        @keyframes revealFromTop {
            0% {
                transform: translateY(-100%);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="text-container">
        <span class="animation text-ab"><span class="depth-right">About</span> <span class="depth-left">Us</span></span>
        <br>
        <div class="container" id="profileContainer"></div>

        <div class="modal" id="modal">
            <div class="modal-content">
                <button class="close-btn" onclick="closeModal()">&times;</button>
                <img class="modal-image" id="modalImage" src="" alt="Profile">
                <h2 id="modalName"></h2>
                <div class="role" id="modalRole"></div>
                <p id="modalDescription"></p>
            </div>
        </div>
    </div>
    <script>
        const profiles = [{
                name: "Toxic",
                role: "(Co-)Owner, Lead Developer",
                image: "https://cdn.jsdelivr.net/gh/ToxicBurstXZ/img@main/profiles/toxic-pf.png",
                description: "Owner of Cooking Time, Web Developer, Coding Languages : HTML, CSS, JS, and Learn Python. I usually design the main pages of the website"
            },
            {
                name: "Void",
                role: "(Co-)Owner, Developer",
                image: "https://cdn.jsdelivr.net/gh/ToxicBurstXZ/img@main/profiles/void.gif",
                description: "Owner of The Void, Backend Developer, i know Python and C++. Creating and fixing bugs and games (also I obtained all the games)"
            }
        ];

        function createProfileButtons() {
            const container = document.getElementById('profileContainer');

            profiles.forEach((profile, index) => {
                const btn = document.createElement('button');
                btn.className = 'profile-btn';
                btn.onclick = () => openModal(index);

                const img = document.createElement('img');
                img.src = profile.image;
                img.alt = profile.name;

                btn.appendChild(img);
                container.appendChild(btn);
            });
        }

        function openModal(index) {
            const profile = profiles[index];
            document.getElementById('modalImage').src = profile.image;
            document.getElementById('modalName').textContent = profile.name;
            document.getElementById('modalRole').textContent = profile.role;
            document.getElementById('modalDescription').textContent = profile.description;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Close modal when clicking outside
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Initialize profile buttons
        createProfileButtons();
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const animatedText = document.querySelector('.animation');

            setTimeout(() => {
                animatedText.classList.add('reveal');
            }, 100);
        });
    </script>

    <!-- Corner black hole -->
    <script>
        const bhCanvas = document.createElement('canvas');
        const bhCtx = bhCanvas.getContext('2d');
        document.body.appendChild(bhCanvas);

        bhCanvas.style.position = 'fixed';
        bhCanvas.style.top = '0';
        bhCanvas.style.left = '0';
        bhCanvas.style.width = '100vw';
        bhCanvas.style.height = '100vh';
        bhCanvas.style.zIndex = '-1';
        bhCanvas.style.pointerEvents = 'none'; // lets clicks pass through to profile buttons

        bhCanvas.width = window.innerWidth;
        bhCanvas.height = window.innerHeight;

        const bhRadius = 90; // smaller than the main page, since this is a corner accent
        const cornerMargin = 140; // pulled back a bit from the very corner
        let miniX = bhCanvas.width - cornerMargin;
        let miniY = bhCanvas.height - cornerMargin;
        const pullStrength = 0.12;

        class LineStar {
            constructor() {
                this.reset(true);
            }
            reset(initial = false) {
                if (initial) {
                    this.x = Math.random() * bhCanvas.width;
                    this.y = Math.random() * bhCanvas.height;
                } else {
                    const edge = Math.floor(Math.random() * 4);
                    if (edge === 0) { this.x = Math.random() * bhCanvas.width; this.y = 0; }
                    else if (edge === 1) { this.x = bhCanvas.width; this.y = Math.random() * bhCanvas.height; }
                    else if (edge === 2) { this.x = Math.random() * bhCanvas.width; this.y = bhCanvas.height; }
                    else { this.x = 0; this.y = Math.random() * bhCanvas.height; }
                }
                this.size = Math.random() * 2 + 2;
                this.baseSize = this.size;
                this.speed = Math.random() * 2 + 2;
                this.opacity = Math.random() * 0.5 + 0.5;
            }
            update() {
                const dx = miniX - this.x;
                const dy = miniY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // straight line: move directly toward the hole, no sideways component
                this.x += (dx / Math.max(dist, 1)) * this.speed;
                this.y += (dy / Math.max(dist, 1)) * this.speed;

                // accelerate slightly as it gets closer
                this.speed += pullStrength * 0.05;

                const shrinkStart = bhRadius * 4;
                if (dist < shrinkStart) {
                    const t = 1 - dist / shrinkStart;
                    this.size = this.baseSize * (1 - t * 0.92);
                    this.opacity = 1 - t;
                }
                if (dist < bhRadius + 2) this.reset(false);
            }
            draw() {
                bhCtx.save();
                bhCtx.globalAlpha = Math.max(0, this.opacity);
                bhCtx.fillStyle = 'white';
                bhCtx.beginPath();
                bhCtx.arc(this.x, this.y, Math.max(0.1, this.size), 0, Math.PI * 2);
                bhCtx.fill();
                bhCtx.restore();
            }
        }

        const lineStars = [];
        for (let i = 0; i < 200; i++) lineStars.push(new LineStar());

        let miniPulse = 0;

        function drawMiniDisk() {
            bhCtx.save();
            bhCtx.translate(miniX, miniY);
            bhCtx.scale(1, 0.35); // squash into an ellipse, matches main page's disk

            const points = 100;
            const outerBase = bhRadius * 2.0; // smaller ratio than main page (3.2) to fit the corner hole
            const innerBase = bhRadius * 1.05;

            bhCtx.beginPath();
            // bent outer edge
            for (let i = 0; i <= points; i++) {
                const angle = (i / points) * Math.PI * 2;
                const wobble = Math.sin(angle * 3 + miniPulse * 2) * bhRadius * 0.12 +
                    Math.sin(angle * 7 + miniPulse * 1.3) * bhRadius * 0.05;
                const r = outerBase + wobble;
                const x = Math.cos(angle) * r;
                const y = Math.sin(angle) * r;
                if (i === 0) bhCtx.moveTo(x, y);
                else bhCtx.lineTo(x, y);
            }
            // bent inner hole (subtracted)
            for (let i = 0; i <= points; i++) {
                const angle = (i / points) * Math.PI * 2;
                const wobble = Math.sin(angle * 3 + miniPulse * 2) * bhRadius * 0.04;
                const r = innerBase + wobble;
                const x = Math.cos(-angle) * r;
                const y = Math.sin(-angle) * r;
                if (i === 0) bhCtx.moveTo(x, y);
                else bhCtx.lineTo(x, y);
            }

            const diskGrad = bhCtx.createRadialGradient(0, 0, innerBase, 0, 0, outerBase * 1.3);
            diskGrad.addColorStop(0, 'rgba(220, 160, 255, 0.9)'); // purple-tinted, ties into the page's gradient
            diskGrad.addColorStop(0.4, 'rgba(180, 0, 255, 0.5)');
            diskGrad.addColorStop(1, 'rgba(120, 0, 200, 0)');

            bhCtx.fillStyle = diskGrad;
            bhCtx.fill('evenodd'); // punches the inner hole out
            bhCtx.restore();
        }

        function drawMiniBlackHole() {
            miniPulse += 0.025;
            const pulse = Math.sin(miniPulse) * 0.15 + 0.85;

            const outerGlow = bhCtx.createRadialGradient(miniX, miniY, bhRadius * 0.5, miniX, miniY, bhRadius * 7 * pulse);
            outerGlow.addColorStop(0, 'rgba(140, 0, 220, 0.3)');
            outerGlow.addColorStop(0.4, 'rgba(90, 0, 170, 0.15)');
            outerGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            bhCtx.beginPath();
            bhCtx.arc(miniX, miniY, bhRadius * 7 * pulse, 0, Math.PI * 2);
            bhCtx.fillStyle = outerGlow;
            bhCtx.fill();

            const innerGlow = bhCtx.createRadialGradient(miniX, miniY, bhRadius * 0.8, miniX, miniY, bhRadius * 4 * pulse);
            innerGlow.addColorStop(0, 'rgba(190, 0, 255, 0.9)');
            innerGlow.addColorStop(0.35, 'rgba(140, 0, 230, 0.5)');
            innerGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            bhCtx.beginPath();
            bhCtx.arc(miniX, miniY, bhRadius * 4 * pulse, 0, Math.PI * 2);
            bhCtx.fillStyle = innerGlow;
            bhCtx.fill();

            const holeGrad = bhCtx.createRadialGradient(miniX, miniY, 0, miniX, miniY, bhRadius);
            holeGrad.addColorStop(0, 'rgba(0,0,0,1)');
            holeGrad.addColorStop(0.75, 'rgba(0,0,0,1)');
            holeGrad.addColorStop(1, 'rgba(20,0,40,0.9)');
            bhCtx.beginPath();
            bhCtx.arc(miniX, miniY, bhRadius, 0, Math.PI * 2);
            bhCtx.fillStyle = holeGrad;
            bhCtx.fill();
        }

        function animateMiniBH() {
            bhCtx.clearRect(0, 0, bhCanvas.width, bhCanvas.height);
            drawMiniDisk();
            drawMiniBlackHole();
            lineStars.forEach(s => {
                s.update();
                s.draw();
            });
            requestAnimationFrame(animateMiniBH);
        }
        animateMiniBH();

        window.addEventListener('resize', () => {
            bhCanvas.width = window.innerWidth;
            bhCanvas.height = window.innerHeight;
            miniX = bhCanvas.width - cornerMargin;
            miniY = bhCanvas.height - cornerMargin;
        });
    </script>
</body>

</html>
