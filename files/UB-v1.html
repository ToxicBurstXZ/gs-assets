<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Proxy Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      min-height: 100vh;
      font-family: 'Share Tech Mono', monospace;
    }

    body::before {
      content: "";
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(255,255,255,0.012) 3px,
        rgba(255,255,255,0.012) 4px
      );
      z-index: 9998;
    }

    .portal-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px;
      min-height: 100vh;
    }

    h1 {
      font-family: 'Orbitron', monospace;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: #fff;
      text-align: center;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 12px;
      letter-spacing: .2em;
      color: #555;
      text-align: center;
    }

    .subtitle span { color: #b400ff; }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(3, 260px);
      gap: 24px;
      margin-top: 48px;
    }

    .proxy-btn {
      background: #000;
      border: 1px solid #b400ff;
      padding: 22px 28px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
      width: 100%;
      height: 100%;
      position: relative;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
      transition: box-shadow .2s, transform .15s;
      color: #b400ff;
      font-family: 'Share Tech Mono', monospace;
      text-align: left;
    }

    .proxy-btn::after {
      content: "";
      position: absolute;
      top: 0; right: 0;
      width: 12px; height: 12px;
      border-top: 1px solid #b400ff;
      border-right: 1px solid #b400ff;
    }

    .proxy-btn::before {
      content: "";
      position: absolute;
      bottom: 0; left: 0;
      width: 12px; height: 12px;
      border-bottom: 1px solid #b400ff;
      border-left: 1px solid #b400ff;
    }

    .proxy-btn:hover {
      box-shadow: 0 0 18px rgba(0, 200, 83, .25);
      transform: translateY(-3px);
    }

    .btn-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .btn-name {
      font-size: 15px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .btn-name::before { content: "[ "; }
    .btn-name::after  { content: " ]"; }

    .status-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .s-green  { background: #00C853; box-shadow: 0 0 6px rgba(0,200,83,.7); }
    .s-yellow { background: #FFD600; box-shadow: 0 0 6px rgba(255,214,0,.7); }
    .s-red    { background: #FF1744; box-shadow: 0 0 6px rgba(255,23,68,.7); }

    .status-label { font-size: 11px; letter-spacing: .12em; }
    .sl-green  { color: #00C853; }
    .sl-yellow { color: #FFD600; }
    .sl-red    { color: #FF1744; }

    .btn-desc {
      font-size: 11px;
      color: #8f8f8f;
      letter-spacing: .08em;
      line-height: 1.6;
      border-top: 1px solid #1a1a1a;
      padding-top: 10px;
      width: 100%;
      flex: 1;
    }

    /* ---------- Loading Overlay ---------- */
    .loader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .loader-overlay.active {
      display: flex;
    }

    .loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 320px;
      padding: 40px 34px;
      background: #000;
      border: 1px solid #b400ff;
      position: relative;
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    }

    .loader-card::after {
      content: "";
      position: absolute;
      top: 0; right: 0;
      width: 14px; height: 14px;
      border-top: 1px solid #b400ff;
      border-right: 1px solid #b400ff;
    }

    .loader-card::before {
      content: "";
      position: absolute;
      bottom: 0; left: 0;
      width: 14px; height: 14px;
      border-bottom: 1px solid #b400ff;
      border-left: 1px solid #b400ff;
    }

    .loader-label {
      font-size: 12px;
      letter-spacing: .2em;
      color: #b400ff;
      text-transform: uppercase;
      text-align: center;
    }

    .loader-label span { color: #fff; }

    /* Spinner / Checkmark swap */
    .load-icon {
      width: 54px;
      height: 54px;
      position: relative;
    }

    .spinner-wrap {
      position: absolute;
      inset: 0;
      opacity: 1;
      transform: scale(1);
      transition: opacity .35s ease, transform .35s ease;
    }

    .spinner-wrap.done {
      opacity: 0;
      transform: scale(.7);
    }

    .spinner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(180,0,255,.2);
      border-top-color: #b400ff;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .checkmark {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(.5);
      transition: opacity .35s ease .1s, transform .4s cubic-bezier(.34,1.56,.64,1) .1s;
    }

    .checkmark.show {
      opacity: 1;
      transform: scale(1);
    }

    .checkmark circle {
      fill: none;
      stroke: #00C853;
      stroke-width: 3;
      stroke-dasharray: 158;
      stroke-dashoffset: 158;
      transition: stroke-dashoffset .5s ease .15s;
    }

    .checkmark path {
      fill: none;
      stroke: #00C853;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 30;
      stroke-dashoffset: 30;
      transition: stroke-dashoffset .3s ease .45s;
    }

    .checkmark.show circle {
      stroke-dashoffset: 0;
    }

    .checkmark.show path {
      stroke-dashoffset: 0;
    }

    .eye-icon {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(.5);
      transition: opacity .35s ease .05s, transform .4s cubic-bezier(.34,1.56,.64,1) .05s;
    }

    .eye-icon.show {
      opacity: 1;
      transform: scale(1);
    }

    .eye-icon .eye-outline {
      fill: none;
      stroke: #b400ff;
      stroke-width: 3;
    }

    .eye-icon .eye-pupil {
      fill: #b400ff;
    }

    .eye-icon .eye-pupil-highlight {
      fill: #fff;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 10px;
      background: #111;
      border: 1px solid #333;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #b400ff;
      box-shadow: 0 0 10px rgba(180,0,255,.7);
      transition: width .15s linear;
    }

    .progress-pct {
      font-size: 11px;
      color: #8f8f8f;
      letter-spacing: .1em;
      align-self: flex-end;
      margin-top: -12px;
    }

    /* Continue button */
    .continue-btn {
      width: 100%;
      padding: 12px;
      background: #000;
      border: 1px solid #00C853;
      color: #00C853;
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      letter-spacing: .18em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s, box-shadow .2s;
    }

    .continue-btn.ready {
      opacity: 1;
      pointer-events: auto;
    }

    .continue-btn:hover {
      box-shadow: 0 0 14px rgba(0,200,83,.4);
    }

    .cancel-link {
      font-size: 10px;
      color: #555;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: underline;
    }

    .cancel-link:hover { color: #999; }
  </style>
</head>
<body>
  <div class="portal-wrap">
    <h1>Proxy Portal</h1>
    <p class="subtitle">SELECT TO OPEN &nbsp;|&nbsp; <span>LINK_ONLINE</span></p>
    <div class="btn-grid" id="btnGrid"></div>
  </div>

  <!-- Loading overlay -->
  <div class="loader-overlay" id="loaderOverlay">
    <div class="loader-card">
      <div class="loader-label" id="loaderLabel">CONNECTING TO <span id="loaderTarget">LINK</span></div>
      <div class="load-icon">
        <div class="spinner-wrap" id="spinnerWrap"><div class="spinner"></div></div>
        <svg class="checkmark" id="checkmark" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
          <circle cx="30" cy="30" r="25" />
          <path d="M18 31 L26 39 L42 21" />
        </svg>
        <svg class="eye-icon" id="eyeIcon" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
          <path class="eye-outline" d="M5 30 Q30 8 55 30 Q30 52 5 30 Z" />
          <circle class="eye-pupil" id="eyePupil" cx="30" cy="30" r="7" />
          <circle class="eye-pupil-highlight" id="eyePupilCenter" cx="30" cy="30" r="2.5" />
        </svg>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-pct" id="progressPct">0%</div>
      <button class="continue-btn" id="continueBtn">Continue</button>
      <span class="cancel-link" id="cancelLink">Cancel</span>
    </div>
  </div>

  <script>
    const links = [
      {
        name: "DogeUG",
        url: "https://storage.googleapis.com/canvas-lms/index.html",
        status: "yellow",
        statusText: "ERROR",
        desc: "Stable uptime. No lag or broken features (Report If Broken)."
      },
      {
        name: "Lucide",
        url: "https://cdn.jsdelivr.net/gh/lucideproxy/svg@master/logo.svg#/",
        status: "yellow",
        statusText: "ERROR",
        desc: "Stable uptime. No lag or broken features (Report If Broken)."
      },
      {
        name: "PLACEHOLDER",
        url: "https://placeholder.com",
        status: "red",
        statusText: "NONE",
        desc: "It's Unusable. Note may be down for maintenance or has been blocked."
      },
    ];

    const grid = document.getElementById("btnGrid");
    const overlay = document.getElementById("loaderOverlay");
    const progressFill = document.getElementById("progressFill");
    const progressPct = document.getElementById("progressPct");
    const continueBtn = document.getElementById("continueBtn");
    const cancelLink = document.getElementById("cancelLink");
    const spinnerEl = document.getElementById("spinnerWrap");
    const checkmarkEl = document.getElementById("checkmark");
    const eyeEl = document.getElementById("eyeIcon");
    const eyePupil = document.getElementById("eyePupil");
    const eyePupilCenter = document.getElementById("eyePupilCenter");
    const loaderLabel = document.getElementById("loaderLabel");

    let pendingTimeouts = [];
    let eyeVisible = false;

    function updateEyeTracking(e) {
      if (!eyeVisible) return;
      const rect = eyeEl.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
      const radius = 6;
      const px = 30 + Math.cos(angle) * radius;
      const py = 30 + Math.sin(angle) * radius;
      eyePupil.setAttribute("cx", px);
      eyePupil.setAttribute("cy", py);
      eyePupilCenter.setAttribute("cx", px);
      eyePupilCenter.setAttribute("cy", py);
    }
    document.addEventListener("mousemove", updateEyeTracking);

    let progressTimer = null;
    let pendingUrl = null;

    function resetLoader() {
      clearInterval(progressTimer);
      pendingTimeouts.forEach(clearTimeout);
      pendingTimeouts = [];
      eyeVisible = false;
      progressFill.style.width = "0%";
      progressPct.textContent = "0%";
      continueBtn.classList.remove("ready");
      spinnerEl.classList.remove("done");
      checkmarkEl.classList.remove("show");
      eyeEl.classList.remove("show");
      eyePupil.setAttribute("cx", 30);
      eyePupil.setAttribute("cy", 30);
      eyePupilCenter.setAttribute("cx", 30);
      eyePupilCenter.setAttribute("cy", 30);
      loaderLabel.innerHTML = 'CONNECTING TO <span id="loaderTarget">LINK</span>';
      pendingUrl = null;
    }

    function openLink(url) {
      const win = window.open();
      const iframe = win.document.createElement("iframe");
      iframe.style.cssText = "width:100%;height:100%;border:none;";
      iframe.src = url;
      win.document.body.style.margin = "0";
      win.document.body.appendChild(iframe);
    }

    function startLoad(link) {
      resetLoader();
      pendingUrl = link.url;
      document.getElementById("loaderTarget").textContent = link.name || "LINK";
      overlay.classList.add("active");

      let pct = 0;
      progressTimer = setInterval(() => {
        // randomized increment, tuned so the bar fills in ~1 second
        pct += Math.random() * 3 + 3;
        if (pct >= 100) {
          pct = 100;
          clearInterval(progressTimer);
          continueBtn.classList.add("ready");
          spinnerEl.classList.add("done");
          checkmarkEl.classList.add("show");

          pendingTimeouts.push(setTimeout(() => {
            loaderLabel.textContent = "Connected, but remember...";
          }, 900));

          pendingTimeouts.push(setTimeout(() => {
            checkmarkEl.classList.remove("show");
            eyeEl.classList.add("show");
            eyeVisible = true;
          }, 1700));

          pendingTimeouts.push(setTimeout(() => {
            loaderLabel.innerHTML = 'Big Brother is <span style="color:#FF1744;font-weight:bold;">always</span> watching';
          }, 2700));
        }
        progressFill.style.width = pct + "%";
        progressPct.textContent = Math.floor(pct) + "%";
      }, 40);
    }

    grid.innerHTML = "";
    links.forEach((l) => {
      const btn = document.createElement("button");
      btn.className = "proxy-btn";
      btn.innerHTML = `
        <div class="btn-top">
          <span class="btn-name">${l.name}</span>
          <div class="status-wrap">
            <div class="status-dot s-${l.status}"></div>
            <span class="status-label sl-${l.status}">${l.statusText}</span>
          </div>
        </div>
        <p class="btn-desc">${l.desc}</p>
      `;
      btn.onclick = () => startLoad(l);
      grid.appendChild(btn);
    });

    continueBtn.onclick = () => {
      if (!pendingUrl) return;
      const url = pendingUrl;
      overlay.classList.remove("active");
      resetLoader();
      openLink(url);
    };

    cancelLink.onclick = () => {
      overlay.classList.remove("active");
      resetLoader();
    };
  </script>
</body>
</html>
