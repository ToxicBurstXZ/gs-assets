<!DOCTYPE html>
<html lang="en-us">

    <!-- GameMonetize SDK -->
    <script>
        window.SDK_OPTIONS = {
            gameId: "jp112o3o4hzgrnc7zaewjkrfk282pul8",
            onEvent: function (a) {
                switch (a.name) {

                    case "SDK_GAME_PAUSE":
                        console.log("Game paused.");

                        if (typeof myGameInstance !== "undefined" && myGameInstance) {
                            try {
                                myGameInstance.SendMessage(
                                    "AudioManager",
                                    "MuteAudio"
                                );
                            } catch (e) {
                                console.warn(e);
                            }
                        }
                        break;

                    case "SDK_GAME_START":
                        console.log("Game resumed.");

                        if (typeof myGameInstance !== "undefined" && myGameInstance) {
                            try {
                                myGameInstance.SendMessage(
                                    "AudioManager",
                                    "UnmuteAudio"
                                );
                            } catch (e) {
                                console.warn(e);
                            }
                        }
                        break;

                    case "SDK_READY":
                        console.log("SDK ready.");
                        break;
                }
            }
        };

        (function (a, b, c) {
            var d = a.getElementsByTagName(b)[0];

            if (!a.getElementById(c)) {
                a = a.createElement(b);
                a.id = c;
                a.src = "https://cdn.jsdelivr.net/gh/testamalame/sef@main/sedk.js";
                d.parentNode.insertBefore(a, d);
            }
        })(document, "script", "gamemonetize-sdk");
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #000;

            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;

            -webkit-tap-highlight-color: transparent;
        }

        body {
            position: relative;
        }

        #unity-container {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
        }

        #unity-canvas {
            display: block;

            width: 100% !important;
            height: 100% !important;

            outline: none;

            background: #000;

            touch-action: none;
        }

        #loading-cover {
            position: absolute;
            inset: 0;

            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 100%;

            background: #000;
        }

        #unity-loading-bar {
            width: min(80%, 400px);

            text-align: center;
        }

        #unity-progress-bar-empty {
            width: 100%;
            height: 8px;

            margin-top: 15px;

            overflow: hidden;

            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
        }

        #unity-progress-bar-full {
            width: 0%;
            height: 100%;

            border-radius: 10px;

            background: #fff;

            transition: width 0.1s linear;
        }

        .spinner {
            width: 35px;
            height: 35px;

            margin: 20px auto;

            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        canvas:focus {
            outline: none;
        }
    </style>
</head>

<body class="dark">

    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <div id="loading-cover">
        <div id="unity-loading-bar">

            <div id="unity-logo"></div>

            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>

            <div class="spinner"></div>

        </div>
    </div>

    <script>
        /*
         * ============================================================
         * UNITY CONFIGURATION
         * ============================================================
         */

        const buildUrl =
            "https://cdn.jsdelivr.net/gh/z-f3-f1/1@main/Build";

        const loaderUrl =
            buildUrl + "/yandexBrotli.loader.js";

        const config = {
            dataUrl:
                buildUrl + "/yandexBrotli.data.br",

            frameworkUrl:
                buildUrl + "/yandexBrotli.framewor.js",

            streamingAssetsUrl:
                "StreamingAssets",

            companyName:
                "Brain massage",

            productName:
                "Supercar Battle Royale",

            productVersion:
                "0.0.197"
        };


        /*
         * ============================================================
         * ELEMENTS
         * ============================================================
         */

        const container =
            document.getElementById("unity-container");

        const canvas =
            document.getElementById("unity-canvas");

        const loadingCover =
            document.getElementById("loading-cover");

        const progressBarEmpty =
            document.getElementById("unity-progress-bar-empty");

        const progressBarFull =
            document.getElementById("unity-progress-bar-full");

        const spinner =
            document.querySelector(".spinner");


        /*
         * ============================================================
         * GLOBALS
         * ============================================================
         */

        let myGameInstance = null;

        let isAdShown = false;

        let unityStarted = false;


        /*
         * ============================================================
         * MOBILE
         * ============================================================
         */

        const isMobile =
            /iPhone|iPad|iPod|Android/i.test(
                navigator.userAgent
            );

        if (isMobile) {
            container.classList.add("unity-mobile");
        } else {
            container.classList.add("unity-desktop");
        }


        /*
         * ============================================================
         * LOAD SPLIT WASM FILE
         * ============================================================
         */

        function loadAndMergeFiles(files) {

            return files.reduce(
                (promise, file) => {

                    return promise.then(
                        async (chunks) => {

                            const response =
                                await fetch(
                                    buildUrl + "/" + file
                                );

                            if (!response.ok) {
                                throw new Error(
                                    "Failed to load: " + file
                                );
                            }

                            const data =
                                await response.arrayBuffer();

                            chunks.push(
                                new Uint8Array(data)
                            );

                            return chunks;
                        }
                    );

                },
                Promise.resolve([])
            );
        }


        /*
         * ============================================================
         * ADS
         * ============================================================
         */

        function showAdOnClick() {

            if (
                !isAdShown &&
                typeof sdk !== "undefined" &&
                typeof sdk.showBanner === "function"
            ) {
                try {
                    sdk.showBanner();
                    isAdShown = true;
                } catch (error) {
                    console.warn(
                        "Ad error:",
                        error
                    );
                }
            }
        }


        /*
         * ============================================================
         * FOCUS
         * ============================================================
         */

        function focusGame() {

            try {
                canvas.focus();
            } catch (e) {
                console.warn(e);
            }
        }


        /*
         * ============================================================
         * START UNITY
         * ============================================================
         */

        async function startUnity() {

            /*
             * Prevent the game from being initialized twice.
             */
            if (unityStarted) {
                return;
            }

            unityStarted = true;

            try {

                const wasmFiles = [
                    "yandexBrotli.wasm.br.part1",
                    "yandexBrotli.wasm.br.part2"
                ];

                /*
                 * Merge the split WASM files.
                 */
                const chunks =
                    await loadAndMergeFiles(wasmFiles);

                const mergedBlob =
                    new Blob(chunks, {
                        type: "application/wasm"
                    });

                config.codeUrl =
                    URL.createObjectURL(
                        mergedBlob
                    );


                /*
                 * Load Unity loader.
                 */
                const script =
                    document.createElement("script");

                script.src = loaderUrl;

                script.onload = async function () {

                    try {

                        myGameInstance =
                            await createUnityInstance(
                                canvas,
                                config,
                                function (progress) {

                                    progressBarFull.style.width =
                                        (100 * progress) + "%";

                                }
                            );

                        /*
                         * Unity is ready.
                         */
                        loadingCover.style.display =
                            "none";

                        focusGame();

                        /*
                         * Ad handling.
                         */
                        canvas.addEventListener(
                            "pointerdown",
                            showAdOnClick,
                            { passive: true }
                        );

                    } catch (error) {

                        console.error(
                            "Unity initialization failed:",
                            error
                        );

                        showError(
                            "Unable to load the game."
                        );
                    }
                };

                script.onerror = function () {

                    console.error(
                        "Unable to load Unity loader."
                    );

                    showError(
                        "Unable to load the game."
                    );
                };

                document.body.appendChild(script);

            } catch (error) {

                console.error(
                    "Game loading failed:",
                    error
                );

                showError(
                    "Unable to load the game."
                );
            }
        }


        /*
         * ============================================================
         * ERROR DISPLAY
         * ============================================================
         */

        function showError(message) {

            loadingCover.style.display = "flex";

            loadingCover.innerHTML = `
                <div style="
                    color:white;
                    font-family:Arial,sans-serif;
                    text-align:center;
                    padding:20px;
                ">
                    <div style="
                        font-size:18px;
                        margin-bottom:10px;
                    ">
                        ${message}
                    </div>

                    <button
                        onclick="location.reload()"
                        style="
                            padding:10px 20px;
                            border:0;
                            border-radius:6px;
                            cursor:pointer;
                        "
                    >
                        Retry
                    </button>
                </div>
            `;
        }


        /*
         * ============================================================
         * UNITY / YANDEX COMPATIBILITY FUNCTIONS
         * ============================================================
         */

        let StartUnityInstance = null;
        let ysdk = null;

        let environmentData = {
            language: "en",
            domain: "default_domain",
            deviceType: isMobile ? "mobile" : "desktop",
            isMobile: isMobile,
            isDesktop: !isMobile,
            isTablet: false,
            isTV: false,
            appID: "default_app_id",
            browserLang:
                navigator.language || "en",
            payload: null,
            promptCanShow: false,
            reviewCanShow: false,
            platform:
                navigator.platform || "",
            browser:
                navigator.userAgent
        };

        let cloudSaves = "noData";
        let paymentsData = "none";
        let playerData = "noData";

        let player = null;
        let payments = null;

        let initGame = false;
        let nowFullAdOpen = false;


        function GetPayments() {
            return Promise.resolve("none");
        }

        function SaveCloud() {
            console.warn(
                "SaveCloud is not implemented"
            );
        }

        function LoadCloud() {
            return Promise.resolve("noData");
        }

        function InitPlayer() {
            return Promise.resolve("noData");
        }

        function FullAdShow() {
            console.warn(
                "FullAdShow is not implemented"
            );
        }

        function RewardedShow() {
            console.warn(
                "RewardedShow is not implemented"
            );
        }

        function StickyAdActivity() {
            console.warn(
                "StickyAdActivity is not implemented"
            );
        }

        function Review() {
            console.warn(
                "Review is not implemented"
            );
        }

        function PromptShow() {
            console.warn(
                "PromptShow is not implemented"
            );
        }

        function InitLeaderboards() {
            console.warn(
                "InitLeaderboards is not implemented"
            );
        }

        function GetLeaderboardScores() {
            console.warn(
                "GetLeaderboardScores is not implemented"
            );
        }

        function SetLeaderboardScores() {
            console.warn(
                "SetLeaderboardScores is not implemented"
            );
        }

        function ConsumePurchase() {
            console.warn(
                "ConsumePurchase is not implemented"
            );
        }

        function ConsumePurchases() {
            console.warn(
                "ConsumePurchases is not implemented"
            );
        }

        function InitLeaderboard() {
            console.warn(
                "InitLeaderboard is not implemented"
            );
        }

        function BuyPayments() {
            console.warn(
                "BuyPayments is not implemented"
            );
        }


        /*
         * ============================================================
         * INIT GAME
         * ============================================================
         */

        function InitGame() {

            console.log(
                "Init Game Success"
            );

            initGame = true;

            if (
                nowFullAdOpen === true &&
                myGameInstance
            ) {
                try {
                    myGameInstance.SendMessage(
                        "YandexGame",
                        "OpenFullAd"
                    );
                } catch (e) {
                    console.warn(e);
                }
            }
        }


        /*
         * ============================================================
         * BROWSER EVENTS
         * ============================================================
         */

        document.addEventListener(
            "contextmenu",
            function (event) {
                event.preventDefault();
            }
        );

        window.addEventListener(
            "pointerdown",
            focusGame,
            { passive: true }
        );

        window.addEventListener(
            "touchstart",
            focusGame,
            { passive: true }
        );

        window.addEventListener(
            "unhandledrejection",
            function (event) {

                console.warn(
                    "Unhandled promise rejection:",
                    event.reason
                );

                event.preventDefault();
            }
        );


        /*
         * ============================================================
         * START
         * ============================================================
         */

        progressBarEmpty.style.display = "block";

        startUnity();

    </script>

</body>
</html>
